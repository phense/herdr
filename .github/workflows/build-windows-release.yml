name: Build Windows release

# Forked-repo release pipeline for the windows-port branch.
#
# * `workflow_dispatch` builds the binary and uploads it as a workflow
#   artifact (~7 day retention) — useful for sanity-checking that the build
#   still completes without minting a public release.
# * Pushing a tag matching `windows-port-v*` (e.g. `windows-port-v0.6.2-1`)
#   does the same build, then publishes a prerelease GitHub Release with
#   the `.exe` and `BUILD_INFO.txt` attached.
#
# See `docs/plans/windows-port/RELEASING.md` for the operator checklist.

on:
  workflow_dispatch:
  push:
    tags:
      - 'windows-port-v*'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            artifact: herdr-windows-x86_64

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: release-windows-${{ matrix.target }}

      - name: Build
        shell: pwsh
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package artifact
        shell: pwsh
        run: |
          $exe = "${{ matrix.artifact }}.exe"
          Copy-Item "target/${{ matrix.target }}/release/herdr.exe" $exe
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          @(
            "commit=$env:GITHUB_SHA"
            "ref=$env:GITHUB_REF"
            "target=${{ matrix.target }}"
            "sha256=$hash  $exe"
          ) | Out-File -FilePath BUILD_INFO.txt -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.exe
            BUILD_INFO.txt

  release:
    if: startsWith(github.ref, 'refs/tags/windows-port-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          # Single-artifact download into a known dir so softprops finds
          # the files at a stable path — the no-`name` form behavior
          # changed in v4+ and doesn't auto-create the per-artifact
          # subdir reliably for single-artifact runs.
          name: herdr-windows-x86_64
          path: dist

      - name: List downloaded artifact (debug)
        run: ls -la dist

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            dist/herdr-windows-x86_64.exe
            dist/BUILD_INFO.txt
          body: |
            **Unsigned Windows build** from the [`windows-port`](https://github.com/phense/herdr/tree/windows-port) branch.

            Built from commit `${{ github.sha }}`.

            ## Install

            1. Download `herdr-windows-x86_64.exe` from the assets below.
            2. Move it somewhere on your `PATH` — e.g. `%LOCALAPPDATA%\herdr\herdr.exe`.
            3. Launch from Windows Terminal: `herdr.exe --help`.

            ## Caveats

            - **Unsigned**: Windows SmartScreen will warn the first time you run it. Click **More info → Run anyway**.
            - Some antivirus products (notably Bitdefender) may quarantine `libghostty-vt` build artefacts. Allowlist the install dir if you see that.
            - This is a community port; upstream `ogulcancelik/herdr` does not (yet) ship Windows binaries.
            - Manual smoke checklist: [`SMOKE.md`](https://github.com/phense/herdr/blob/windows-port/docs/plans/windows-port/SMOKE.md).
